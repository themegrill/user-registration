name: Sync Files To Pro
on:
    push:
        branches:
            - develop
            # Temporary: sync the AI abilities epic to the Pro branch of the same name (pro#2062). Remove before merging, with the target in sync-file-list.yml.
            - 2062-ai-mcp-parity
        workflow_dispatch:
jobs:
    sync:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Repository
              uses: actions/checkout@master
            - name: Run GitHub File Sync
              uses: BetaHuhn/repo-file-sync-action@v1.17.17
              with:
                  GH_PAT: ${{ secrets.REPO_SYNC }}
                  COMMIT_BODY: "Update: Sync changes from main repository"
                  ASSIGNEES: som
                  CONFIG_PATH: .github/sync-file-list.yml
