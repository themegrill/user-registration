name: User Registration QA Automation

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
      - labeled
    branches:
      - develop
      - 'v*.*.*'
    # Docs and translation changes cannot affect the automation result.
    paths-ignore:
      - '**.md'
      - 'readme.txt'
      - 'languages/**'

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  qa-automation:
    name: Run UR QA Automation
    # Only react to the QA labels; an unrelated label must not restart (or cancel) a QA run.
    if: >
      github.event.pull_request.draft == false &&
      (
        github.event.action != 'labeled' ||
        github.event.label.name == 'qa-needed' ||
        github.event.label.name == 'final-qa'
      ) &&
      (
        contains(github.event.pull_request.labels.*.name, 'qa-needed') ||
        contains(github.event.pull_request.labels.*.name, 'final-qa')
      )
    # Job-level so a skipped run never cancels a QA run that is in progress.
    # One shared QA site: queue runs so one PR never deploys over another PR's test run.
    concurrency:
      group: ur-qa-site
      cancel-in-progress: false
    # Pinned: ubuntu-latest moved to 26.04, which has no prebuilt Python for setup-python.
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      # 🔍 Decide QA Mode (Smoke vs Final)
      - name: Decide QA mode
        id: qa_mode
        run: |
          if [[ "${{ contains(github.event.pull_request.labels.*.name, 'final-qa') }}" == "true" ]] || \
             [[ "${{ startsWith(github.event.pull_request.title, 'final-qa') }}" == "true" ]]; then
            echo "mode=final" >> $GITHUB_OUTPUT
          else
            echo "mode=smoke" >> $GITHUB_OUTPUT
          fi

      #  Checkout PR Code
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      #  SSH Setup
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.TG_PRIVATE_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      #  Git Config
      - name: Configure Git
        run: |
          git config --global user.email "${{ secrets.TG_GITHUB_EMAIL }}"
          git config --global user.name "${{ secrets.TG_GITHUB_USERNAME }}"

      #  Environment Setup
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          extensions: cli, curl, mbstring, xmlrpc

      - name: Setup PNPM
        uses: pnpm/action-setup@v3
        with:
          version: 9

      #  Build Plugin
      - name: Install & Build
        run: |
          pnpm install
          composer install
          pnpm run build
          composer install --no-dev
          mkdir -p user-registration
          rsync -rc --exclude-from="./.distignore" ./ user-registration --delete --delete-excluded

      - name: Create ZIP
        run: zip -r user-registration.zip user-registration

      #  Deploy to QA Server
      # No separate "remove old plugin" step: deleting the free plugin while add-ons that
      # depend on it are active crashes WordPress, and then WP-CLI cannot reinstall it.
      - name: Upload plugin
        run: |
          sshpass -p "${{ secrets.QA_AUTOMATION_SERVER_PASS }}" scp -o StrictHostKeyChecking=no \
          user-registration.zip \
          ${{ secrets.QA_AUTOMATION_SERVER_USERNAME }}@${{ secrets.QA_AUTOMATION_SERVER_IP }}:/var/www/anup-urautomation.wp1.site/wp-content/plugins/

      - name: Install via WP-CLI
        run: |
          sshpass -p "${{ secrets.QA_AUTOMATION_SERVER_PASS }}" ssh -o StrictHostKeyChecking=no \
          ${{ secrets.QA_AUTOMATION_SERVER_USERNAME }}@${{ secrets.QA_AUTOMATION_SERVER_IP }} << 'EOF'
          set -e
          cd /var/www/anup-urautomation.wp1.site/
          # --skip-plugins/--skip-themes: load WordPress without add-ons that call free-plugin
          # functions, so the install works even if the current copy is missing or broken.
          # --force replaces the existing copy in place.
          wp --skip-plugins --skip-themes plugin install wp-content/plugins/user-registration.zip --force --activate
          rm -f wp-content/plugins/user-registration.zip
          wp --skip-plugins --skip-themes plugin get user-registration --field=version
          EOF

      #  Stop early if the QA site is not serving pages (e.g. a PHP fatal after deploy)
      - name: Check QA site health
        run: |
          code=$(curl -s -o /dev/null -m 30 -w '%{http_code}' https://anup-urautomation.wp1.site/wp-login.php)
          echo "wp-login.php returned HTTP $code"
          if [ "$code" != "200" ]; then
            echo "::error::QA site is not healthy after deploy (HTTP $code). Check the site's PHP error log."
            exit 1
          fi

      #  Browser Setup
      - name: Setup Chrome
        uses: browser-actions/setup-chrome@v1

      #  Python Setup
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      #  Run Automation
      - name: Run UR Automation
        id: automation
        run: |
          mkdir python-code
          cd python-code
          git init
          git remote add origin git@github.com:themegrill/UR-Automation.git
          git pull origin test-ur-free
          pip install -r requirements.txt
          chmod +x test_ur_free.sh
          bash ./test_ur_free.sh "${{ steps.qa_mode.outputs.mode }}"
        # Keep going so the report is still published; the final step fails the job.
        continue-on-error: true

      #  Only publish when the suite actually produced a report
      - name: Check report exists
        id: report
        if: always()
        run: |
          if [ -f python-code/results/report.html ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      #  Upload Artifact
      - name: Upload Report
        uses: actions/upload-artifact@v4
        if: always() && steps.report.outputs.exists == 'true'
        with:
          name: UR-Report
          path: python-code/results/

      - name: Publish Report to Server
        id: publish
        if: always() && steps.report.outputs.exists == 'true'
        run: |
          PR_ID=${{ github.event.pull_request.number }}
          RUN_ID=${{ github.run_number }}

          REMOTE_PATH="/var/www/anup-urautomation.wp1.site/reports/pr-${PR_ID}/run-${RUN_ID}"

          echo "Creating remote directory..."
          sshpass -p "${{ secrets.QA_AUTOMATION_SERVER_PASS }}" ssh -o StrictHostKeyChecking=no \
          ${{ secrets.QA_AUTOMATION_SERVER_USERNAME }}@${{ secrets.QA_AUTOMATION_SERVER_IP }} \
          "mkdir -p $REMOTE_PATH"

          echo "Uploading reports..."
          sshpass -p "${{ secrets.QA_AUTOMATION_SERVER_PASS }}" scp -r -o StrictHostKeyChecking=no \
          python-code/results/* \
          ${{ secrets.QA_AUTOMATION_SERVER_USERNAME }}@${{ secrets.QA_AUTOMATION_SERVER_IP }}:$REMOTE_PATH

          echo "Report URL:"
          echo "https://anup-urautomation.wp1.site/reports/pr-${PR_ID}/run-${RUN_ID}/report.html"

      - name: Comment PR with Execution Report
        if: always()
        uses: actions/github-script@v7
        env:
          AUTOMATION_OUTCOME: ${{ steps.automation.outcome }}
          REPORT_PUBLISHED: ${{ steps.publish.outcome == 'success' }}
          QA_MODE: ${{ steps.qa_mode.outputs.mode }}
        with:
          script: |
            const pr = context.issue.number;
            const run = context.runNumber;
            const passed = process.env.AUTOMATION_OUTCOME === 'success';
            const published = process.env.REPORT_PUBLISHED === 'true';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const reportUrl = `https://anup-urautomation.wp1.site/reports/pr-${pr}/run-${run}/report.html`;

            const status = passed ? '✅ Passed' : '❌ Failed';
            const mode = process.env.QA_MODE || 'smoke';
            const report = published
              ? `**Latest Report:** ${reportUrl}`
              : `No report was published. See the [workflow run](${runUrl}) for details.`;

            // Keep one QA comment per PR and update it, instead of adding a new one every run.
            const marker = '<!-- ur-qa-automation-report -->';
            const body = `${marker}\n**UR QA (${mode}):** ${status} — run #${run}\n\n${report}`;
            const { owner, repo } = context.repo;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number: pr,
              per_page: 100
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number: pr, body });
            }

      #  Fail the job when the suite failed or never ran (continue-on-error hides it otherwise)
      - name: Fail if automation did not pass
        if: always() && steps.automation.outcome != 'success'
        run: |
          echo "UR automation outcome: ${{ steps.automation.outcome }}"
          exit 1
